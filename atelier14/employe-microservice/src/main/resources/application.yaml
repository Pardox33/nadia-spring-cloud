server:
  port: 8081
spring:
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"
  application:
    name: employe
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  profiles:
    active: "prod"
  datasource:
    url: 'jdbc:h2:mem:employesdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s
  cloud:
    discovery:
      enabled: true
    function:
      definition: updateCommunication
      stream:
        bindings:
          sendCommunication-out-0:
            destination: send-communication
          updateCommunication-in-0:
            destination: communication-sent
            group: ${spring.application.name}
    openfeign:
      circuitbreaker:
        enabled: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: "${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}"
management:
  endpoints:
    web:
      exposure:
        include: '*'
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000